BBPATH .= ":${LAYERDIR}"

BBFILES += "${LAYERDIR}/recipes-*/*/*.bb \
            ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "qnx-hyp"
BBFILE_PATTERN_qnx-hyp = "^${LAYERDIR}/"
BBFILE_PRIORITY_qnx-hyp = "20"

# Everything QNX-specific comes from meta-qnx. This layer contributes only
# policy: which applications exist, and what the images look like.
LAYERDEPENDS_qnx-hyp = "core qnx"
LAYERSERIES_COMPAT_qnx-hyp = "scarthgap"

# Shared .build fragments this layer offers to image templates -- its own and
# other layers'. The RPi5 board stanzas live here, so a second image for the
# same board includes them rather than copying them.
QNX_TEMPLATE_INCLUDE_PATH += "${LAYERDIR}/files/ifs"

# The SDP contract for this board: which packages, at which versions, the
# hypervisor host is built against. Adopted from the project's own
# qsc_install_packages.list, which is byte-for-byte the format
# `qnxsoftwarecenter_clt -listInstalledRoots` prints.
#
# It lives here rather than in a project working tree because it describes what
# *these layers* need -- a checkout of this layer should be able to say whether
# an SDP is adequate without also having somebody's application repository. An
# individual build overrides QNX_SDP_LOCKFILE in local.conf as usual.
QNX_SDP_LOCKFILE ??= "${LAYERDIR}/conf/qnx-sdp-lockfile.list"

# ssh-keygen, for the ssh-hostkeys recipe. bitbake gives a task a PATH built
# only from HOSTTOOLS, so a host binary not named here is simply absent -- the
# failure is "ssh-keygen: command not found" inside do_compile, which reads as a
# broken build machine rather than a missing declaration.
HOSTTOOLS += "ssh-keygen"
