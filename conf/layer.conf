BBPATH .= ":${LAYERDIR}"

BBFILES += "${LAYERDIR}/recipes-*/*/*.bb \
            ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "qnx-hyp"
BBFILE_PATTERN_qnx-hyp = "^${LAYERDIR}/"
BBFILE_PRIORITY_qnx-hyp = "20"

# Everything QNX-specific comes from meta-qnx. This layer contributes only
# policy: which applications exist, and what the images look like.
LAYERDEPENDS_qnx-hyp = "core qnx"
LAYERSERIES_COMPAT_qnx-hyp = "scarthgap"

# Shared .build fragments this layer offers to image templates -- its own and
# other layers'. The RPi5 board stanzas live here, so a second image for the
# same board includes them rather than copying them.
QNX_TEMPLATE_INCLUDE_PATH += "${LAYERDIR}/files/ifs"
